AWSTemplateFormatVersion: '2010-09-09'
Description: DevOps Agent setup for SQL Server DBOps. Provisions the query-tools
  Lambda, pymssql layer, AgentCore MCP gateway and target, DevOps Agent
  space/service/association, and alarm-driven webhook plumbing. The investigation
  skill is uploaded separately (see the README in deployment/devops-agent). Deploy
  with `aws cloudformation package` then `deploy`; minting the webhook credentials in
  the console remains a manual step.
Parameters:
  DBInstanceId:
    Type: String
    Description: RDS instance identifier (dbops stack output DBInstanceId)
  DBSecretArn:
    Type: String
    Description: Secrets Manager ARN for DB credentials (dbops stack output 
      DBSecretId)
  SnsTopicName:
    Type: String
    Description: SNS topic name for alert notifications (dbops stack output 
      SNSTopicName)
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the tool Lambdas' VPC config
  Subnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First subnet for Lambda VPC config
  Subnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second subnet for Lambda VPC config
  AgentSpaceName:
    Type: String
    Default: sql-server-dbops
    Description: Name for the DevOps Agent Space
  SigningRoleName:
    Type: String
    Default: AgentCoreDBOpsRole
    Description: Name for the multi-purpose signing/execution role the stack 
      creates
Resources:
  SigningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: SigningRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock-agentcore.amazonaws.com
            - lambda.amazonaws.com
          Action: sts:AssumeRole
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action:
          - sts:AssumeRole
          - sts:TagSession
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      ManagedPolicyArns:
      - Fn::Sub: 
          arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
      - PolicyName: dbops-tool-permissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: PerformanceInsights
            Effect: Allow
            Action:
            - pi:GetResourceMetrics
            - pi:DescribeDimensionKeys
            - pi:GetDimensionKeyDetails
            Resource:
              Fn::Sub: arn:aws:pi:*:${AWS::AccountId}:metrics/rds/*
          - Sid: KMSDecryptForPI
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: pi.${AWS::Region}.amazonaws.com
          - Sid: CloudWatchMetrics
            Effect: Allow
            Action:
            - cloudwatch:GetMetricStatistics
            - cloudwatch:GetMetricData
            - cloudwatch:ListMetrics
            - cloudwatch:DescribeAlarms
            Resource: '*'
          - Sid: RDSReadOnly
            Effect: Allow
            Action:
            - rds:DescribeDBInstances
            - rds:DescribeDBSnapshots
            - rds:DescribeEvents
            Resource: '*'
          - Sid: SecretsManagerDBCredentials
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Ref: DBSecretArn
            - Ref: WebhookSecret
          - Sid: SNSPublishAlerts
            Effect: Allow
            Action:
            - sns:Publish
            - sns:ListTopics
            Resource:
              Fn::Sub: arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*
          - Sid: InvokeToolLambdas
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::Sub:
                arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dbops-query-tools
  InvokeGatewayPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: InvokeDbopsGateway
      Roles:
      - Ref: SigningRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowGatewayInvocation
          Effect: Allow
          Action:
          - bedrock-agentcore:InvokeGateway
          Resource:
            Fn::GetAtt:
            - McpGateway
            - GatewayArn
  AgentSpaceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DevOpsAgentRole-AgentSpace
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: 
                  arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AIDevOpsAgentAccessPolicy
      Policies:
      - PolicyName: AllowCreateServiceLinkedRoles
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: AllowCreateServiceLinkedRoles
            Effect: Allow
            Action:
            - iam:CreateServiceLinkedRole
            Resource:
            - Fn::Sub: 
                arn:aws:iam::${AWS::AccountId}:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer
  WebappAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DevOpsAgentRole-WebappAdmin
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action:
          - sts:AssumeRole
          - sts:TagSession
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: 
                  arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AIDevOpsOperatorAppAccessPolicy
  PymssqlLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: pymssql-layer
      CompatibleRuntimes:
      - python3.12
      Content: ./pymssql-layer-3.12.zip
  QueryToolsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbops-query-tools
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - SigningRole
        - Arn
      Code: ./lambda/query
      Layers:
      - Ref: PymssqlLayer
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
        - Ref: SecurityGroupId
        SubnetIds:
        - Ref: Subnet1
        - Ref: Subnet2
      Environment:
        Variables:
          DB_INSTANCE_ID:
            Ref: DBInstanceId
          DB_SECRET_ID:
            Ref: DBSecretArn
          AWS_REGION_NAME:
            Ref: AWS::Region
          SNS_TOPIC_NAME:
            Ref: SnsTopicName
  QueryToolsGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: QueryToolsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dbops-devops-agent-webhook
      Description: DevOps Agent webhook credentials for alarm-triggered 
        investigations
      SecretString: '{"webhookUrl":"REPLACE_AFTER_STEP_16A","webhookSecret":"REPLACE_AFTER_STEP_16A"}'
  WebhookExecutorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbops-webhook-executor
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - SigningRole
        - Arn
      Code: ./lambda/webhook
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          WEBHOOK_SECRET_ARN:
            Ref: WebhookSecret
  WebhookAlarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebhookExecutorFunction
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighCPU
      AlarmDescription: RDS CPU utilization high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  HighConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighConnections
      AlarmDescription: RDS database connections high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  HighReadLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighReadLatency
      AlarmDescription: RDS read latency high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: ReadLatency
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  McpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: dbops-mcp-gateway
      RoleArn:
        Fn::GetAtt:
        - SigningRole
        - Arn
      ProtocolType: MCP
      AuthorizerType: AWS_IAM
      ProtocolConfiguration:
        Mcp:
          SearchType: SEMANTIC
  QueryToolsTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn: QueryToolsGatewayPermission
    Properties:
      Name: dbops-query-tools
      GatewayIdentifier:
        Fn::GetAtt:
        - McpGateway
        - GatewayIdentifier
      CredentialProviderConfigurations:
      - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn:
              Fn::GetAtt:
              - QueryToolsFunction
              - Arn
            ToolSchema:
              InlinePayload:
              - Name: check_query_store_enabled
                Description: Check if Query Store is enabled on the database
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_store_top_queries
                Description: Get top queries from Query Store by CPU, duration, 
                  IO, or memory
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Sort metric: cpu, duration, io, memory (default
                        cpu)'
                    top_n:
                      Type: integer
                      Description: Number of results (default 10)
              - Name: get_query_store_regressed_queries
                Description: Get queries that have regressed in performance
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Metric to compare: cpu, duration, io (default
                        cpu)'
              - Name: get_query_store_wait_stats
                Description: Get wait statistics from Query Store
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_execution_history
                Description: Get execution history for a specific query
                InputSchema:
                  Type: object
                  Properties:
                    query_id:
                      Type: integer
                      Description: Query Store query ID
                  Required:
                  - query_id
              - Name: get_query_store_plan_summary
                Description: Get plan summary for a specific query
                InputSchema:
                  Type: object
                  Properties:
                    query_id:
                      Type: integer
                      Description: Query Store query ID
                  Required:
                  - query_id
              - Name: get_slow_queries
                Description: Get currently running slow queries
                InputSchema:
                  Type: object
                  Properties:
                    threshold_seconds:
                      Type: integer
                      Description: Minimum elapsed time in seconds (default 5)
              - Name: get_blocking_sessions
                Description: Get current blocking session chains
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_plan_from_cache
                Description: Get execution plan from plan cache for a query
                InputSchema:
                  Type: object
                  Properties:
                    sql_text_pattern:
                      Type: string
                      Description: SQL text pattern to search for
                  Required:
                  - sql_text_pattern
              - Name: get_expensive_queries_from_cache
                Description: Get most expensive queries from plan cache
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Sort metric: cpu, reads, duration (default cpu)'
                    top_n:
                      Type: integer
                      Description: Number of results (default 10)
              - Name: suggest_indexes
                Description: Get missing index suggestions from SQL Server
                InputSchema:
                  Type: object
                  Properties:
                    table_name:
                      Type: string
                      Description: 'Optional: filter to specific table'
              - Name: get_index_usage
                Description: Get index usage statistics
                InputSchema:
                  Type: object
                  Properties:
                    table_name:
                      Type: string
                      Description: 'Optional: filter to specific table'
              - Name: send_email_notification
                Description: Send an alert notification via SNS
                InputSchema:
                  Type: object
                  Properties:
                    subject:
                      Type: string
                      Description: Email subject
                    message:
                      Type: string
                      Description: Email body
                    severity:
                      Type: string
                      Description: INFO, WARNING, or CRITICAL
                  Required:
                  - subject
                  - message
  AgentSpace:
    Type: AWS::DevOpsAgent::AgentSpace
    Properties:
      Name:
        Ref: AgentSpaceName
      Description: Agent Space for SQL Server database operations
      OperatorApp:
        Iam:
          OperatorAppRoleArn:
            Fn::GetAtt:
            - WebappAdminRole
            - Arn
  AwsAccountAssociation:
    Type: AWS::DevOpsAgent::Association
    Properties:
      AgentSpaceId:
        Fn::GetAtt:
        - AgentSpace
        - AgentSpaceId
      ServiceId: aws
      Configuration:
        Aws:
          AccountId:
            Ref: AWS::AccountId
          AccountType: monitor
          AssumableRoleArn:
            Fn::GetAtt:
            - AgentSpaceRole
            - Arn
  McpService:
    Type: AWS::DevOpsAgent::Service
    DependsOn: InvokeGatewayPolicy
    Properties:
      ServiceType: mcpserversigv4
      ServiceDetails:
        MCPServerSigV4:
          Name: dbops-mcp
          Endpoint:
            Fn::GetAtt:
            - McpGateway
            - GatewayUrl
          Description: SQL Server diagnostic tools via AgentCore Gateway
          AuthorizationConfig:
            Region:
              Ref: AWS::Region
            Service: bedrock-agentcore
            McpRoleArn:
              Fn::GetAtt:
              - SigningRole
              - Arn
  McpToolAssociation:
    Type: AWS::DevOpsAgent::Association
    DependsOn:
    - QueryToolsTarget
    Properties:
      AgentSpaceId:
        Fn::GetAtt:
        - AgentSpace
        - AgentSpaceId
      ServiceId:
        Fn::GetAtt:
        - McpService
        - ServiceId
      Configuration:
        MCPServerSigV4:
          Tools:
          - dbops-query-tools___check_query_store_enabled
          - dbops-query-tools___get_blocking_sessions
          - dbops-query-tools___get_expensive_queries_from_cache
          - dbops-query-tools___get_index_usage
          - dbops-query-tools___get_query_execution_history
          - dbops-query-tools___get_query_plan_from_cache
          - dbops-query-tools___get_query_store_plan_summary
          - dbops-query-tools___get_query_store_regressed_queries
          - dbops-query-tools___get_query_store_top_queries
          - dbops-query-tools___get_query_store_wait_stats
          - dbops-query-tools___get_slow_queries
          - dbops-query-tools___send_email_notification
          - dbops-query-tools___suggest_indexes
Outputs:
  GatewayUrl:
    Description: AgentCore MCP gateway URL
    Value:
      Fn::GetAtt:
      - McpGateway
      - GatewayUrl
  SigningRoleArn:
    Description: Multi-purpose signing/execution role ARN
    Value:
      Fn::GetAtt:
      - SigningRole
      - Arn
  AgentSpaceId:
    Description: DevOps Agent Space ID
    Value:
      Fn::GetAtt:
      - AgentSpace
      - AgentSpaceId
  WebhookSecretArn:
    Description: Webhook secret ARN — populate after Step 16a (console)
    Value:
      Ref: WebhookSecret
