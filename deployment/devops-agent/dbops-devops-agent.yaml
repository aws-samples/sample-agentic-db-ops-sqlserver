    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId:
        Fn::GetAtt:
        - AgentSpace
        - AgentSpaceId
      AssetType: agents_md
      Metadata:
        agent_type: INCIDENT_RCA
      Files:
      - Path: AGENTS.md
        ContentText: "Agent Type: Investigation (INCIDENT_RCA)\n\n# Investigation\
          \ Agent Instructions\n\n## SQL Server Investigations\n\nWhen investigating\
          \ issues involving SQL Server or RDS SQL Server instances, always\nuse the\
          \ `sql-server-investigation` skill.\n\n### Triggers\n\nApply this skill\
          \ when the investigation involves any of the following:\n\n- SQL Server\
          \ or MSSQL database instances\n- RDS SQL Server (any edition)\n- High CPU,\
          \ query timeouts, or performance issues on SQL Server\n- Blocking, deadlocks,\
          \ or lock contention\n- Query performance degradation or regressions\n\n\
          ### Why\n\nThe `sql-server-investigation` skill provides SQL Server-specific\
          \ diagnostic\ncapabilities including:\n\n- DMV analysis (`sys.dm_exec_requests`,\
          \ `sys.dm_tran_locks`, `sys.dm_os_waiting_tasks`)\n- Blocking chain identification\n\
          - Wait event interpretation (LCK_M_IX, LCK_M_X, LCK_M_S, CXPACKET, etc.)\n\
          - Query Store and execution plan analysis\n- Extended Events (XEL) file\
          \ parsing\n\nThese capabilities go beyond generic AWS observability tools\
          \ and provide deeper root\ncause analysis for SQL Server-specific issues.\n"
