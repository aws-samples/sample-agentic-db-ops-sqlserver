AWSTemplateFormatVersion: '2010-09-09'
Description: DevOps Agent setup for SQL Server DBOps. Provisions Lambdas, pymssql
  layer, AgentCore MCP gateway and targets, DevOps Agent space/service/association,
  skill and agent-instruction assets, and alarm-driven webhook plumbing. See the
  README in deployment/devops-agent for the walkthrough. Deploy with
  `aws cloudformation package` (uploads Lambda/layer artifacts) then `deploy`.
  Minting the webhook URL and secret in the console remains a manual step.
Parameters:
  DBInstanceId:
    Type: String
    Description: RDS instance identifier (dbops stack output DBInstanceId)
  DBSecretArn:
    Type: String
    Description: Secrets Manager ARN for DB credentials (dbops stack output 
      DBSecretId)
  SnsTopicName:
    Type: String
    Description: SNS topic name for alert notifications (dbops stack output 
      SNSTopicName)
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group for the tool Lambdas' VPC config
  Subnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First subnet for Lambda VPC config
  Subnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Second subnet for Lambda VPC config
  AgentSpaceName:
    Type: String
    Default: sql-server-dbops
    Description: Name for the DevOps Agent Space
  SigningRoleName:
    Type: String
    Default: AgentCoreDBOpsRole
    Description: Name for the multi-purpose signing/execution role the stack 
      creates
Resources:
  SigningRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: SigningRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock-agentcore.amazonaws.com
            - lambda.amazonaws.com
          Action: sts:AssumeRole
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action:
          - sts:AssumeRole
          - sts:TagSession
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
      ManagedPolicyArns:
      - Fn::Sub: 
          arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
      - PolicyName: dbops-tool-permissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: PerformanceInsights
            Effect: Allow
            Action:
            - pi:GetResourceMetrics
            - pi:DescribeDimensionKeys
            - pi:GetDimensionKeyDetails
            Resource:
              Fn::Sub: arn:aws:pi:*:${AWS::AccountId}:metrics/rds/*
          - Sid: KMSDecryptForPI
            Effect: Allow
            Action:
            - kms:Decrypt
            - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService:
                  Fn::Sub: pi.${AWS::Region}.amazonaws.com
          - Sid: CloudWatchMetrics
            Effect: Allow
            Action:
            - cloudwatch:GetMetricStatistics
            - cloudwatch:GetMetricData
            - cloudwatch:ListMetrics
            - cloudwatch:DescribeAlarms
            Resource: '*'
          - Sid: RDSReadOnly
            Effect: Allow
            Action:
            - rds:DescribeDBInstances
            - rds:DescribeDBSnapshots
            - rds:DescribeEvents
            Resource: '*'
          - Sid: SecretsManagerDBCredentials
            Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
            - Ref: DBSecretArn
            - Ref: WebhookSecret
          - Sid: SNSPublishAlerts
            Effect: Allow
            Action:
            - sns:Publish
            - sns:ListTopics
            Resource:
              Fn::Sub: arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*
          - Sid: InvokeToolLambdas
            Effect: Allow
            Action:
            - lambda:InvokeFunction
            Resource:
            - Fn::Sub:
                arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:dbops-query-tools
  InvokeGatewayPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: InvokeDbopsGateway
      Roles:
      - Ref: SigningRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowGatewayInvocation
          Effect: Allow
          Action:
          - bedrock-agentcore:InvokeGateway
          Resource:
            Fn::GetAtt:
            - McpGateway
            - GatewayArn
  AgentSpaceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DevOpsAgentRole-AgentSpace
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: 
                  arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AIDevOpsAgentAccessPolicy
      Policies:
      - PolicyName: AllowCreateServiceLinkedRoles
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: AllowCreateServiceLinkedRoles
            Effect: Allow
            Action:
            - iam:CreateServiceLinkedRole
            Resource:
            - Fn::Sub: 
                arn:aws:iam::${AWS::AccountId}:role/aws-service-role/resource-explorer-2.amazonaws.com/AWSServiceRoleForResourceExplorer
  WebappAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DevOpsAgentRole-WebappAdmin
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: aidevops.amazonaws.com
          Action:
          - sts:AssumeRole
          - sts:TagSession
          Condition:
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
            ArnLike:
              aws:SourceArn:
                Fn::Sub: 
                  arn:aws:aidevops:${AWS::Region}:${AWS::AccountId}:agentspace/*
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AIDevOpsOperatorAppAccessPolicy
  PymssqlLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: pymssql-layer
      CompatibleRuntimes:
      - python3.12
      Content: ./pymssql-layer-3.12.zip
  QueryToolsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbops-query-tools
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - SigningRole
        - Arn
      Code: ./lambda/query
      Layers:
      - Ref: PymssqlLayer
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
        - Ref: SecurityGroupId
        SubnetIds:
        - Ref: Subnet1
        - Ref: Subnet2
      Environment:
        Variables:
          DB_INSTANCE_ID:
            Ref: DBInstanceId
          DB_SECRET_ID:
            Ref: DBSecretArn
          AWS_REGION_NAME:
            Ref: AWS::Region
          SNS_TOPIC_NAME:
            Ref: SnsTopicName
  QueryToolsGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: QueryToolsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dbops-devops-agent-webhook
      Description: DevOps Agent webhook credentials for alarm-triggered 
        investigations
      SecretString: '{"webhookUrl":"REPLACE_AFTER_STEP_16A","webhookSecret":"REPLACE_AFTER_STEP_16A"}'
  WebhookExecutorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dbops-webhook-executor
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role:
        Fn::GetAtt:
        - SigningRole
        - Arn
      Code: ./lambda/webhook
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          WEBHOOK_SECRET_ARN:
            Ref: WebhookSecret
  WebhookAlarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WebhookExecutorFunction
      Action: lambda:InvokeFunction
      Principal: lambda.alarms.cloudwatch.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighCPU
      AlarmDescription: RDS CPU utilization high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  HighConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighConnections
      AlarmDescription: RDS database connections high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  HighReadLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dbops-demo-HighReadLatency
      AlarmDescription: RDS read latency high — triggers DevOps Agent 
        investigation
      Namespace: AWS/RDS
      MetricName: ReadLatency
      Dimensions:
      - Name: DBInstanceIdentifier
        Value:
          Ref: DBInstanceId
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0.02
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Fn::GetAtt:
        - WebhookExecutorFunction
        - Arn
  McpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: dbops-mcp-gateway
      RoleArn:
        Fn::GetAtt:
        - SigningRole
        - Arn
      ProtocolType: MCP
      AuthorizerType: AWS_IAM
      ProtocolConfiguration:
        Mcp:
          SearchType: SEMANTIC
  QueryToolsTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    DependsOn: QueryToolsGatewayPermission
    Properties:
      Name: dbops-query-tools
      GatewayIdentifier:
        Fn::GetAtt:
        - McpGateway
        - GatewayIdentifier
      CredentialProviderConfigurations:
      - CredentialProviderType: GATEWAY_IAM_ROLE
      TargetConfiguration:
        Mcp:
          Lambda:
            LambdaArn:
              Fn::GetAtt:
              - QueryToolsFunction
              - Arn
            ToolSchema:
              InlinePayload:
              - Name: check_query_store_enabled
                Description: Check if Query Store is enabled on the database
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_store_top_queries
                Description: Get top queries from Query Store by CPU, duration, 
                  IO, or memory
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Sort metric: cpu, duration, io, memory (default
                        cpu)'
                    top_n:
                      Type: integer
                      Description: Number of results (default 10)
              - Name: get_query_store_regressed_queries
                Description: Get queries that have regressed in performance
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Metric to compare: cpu, duration, io (default
                        cpu)'
              - Name: get_query_store_wait_stats
                Description: Get wait statistics from Query Store
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_execution_history
                Description: Get execution history for a specific query
                InputSchema:
                  Type: object
                  Properties:
                    query_id:
                      Type: integer
                      Description: Query Store query ID
                  Required:
                  - query_id
              - Name: get_query_store_plan_summary
                Description: Get plan summary for a specific query
                InputSchema:
                  Type: object
                  Properties:
                    query_id:
                      Type: integer
                      Description: Query Store query ID
                  Required:
                  - query_id
              - Name: get_slow_queries
                Description: Get currently running slow queries
                InputSchema:
                  Type: object
                  Properties:
                    threshold_seconds:
                      Type: integer
                      Description: Minimum elapsed time in seconds (default 5)
              - Name: get_blocking_sessions
                Description: Get current blocking session chains
                InputSchema:
                  Type: object
                  Properties: {}
              - Name: get_query_plan_from_cache
                Description: Get execution plan from plan cache for a query
                InputSchema:
                  Type: object
                  Properties:
                    sql_text_pattern:
                      Type: string
                      Description: SQL text pattern to search for
                  Required:
                  - sql_text_pattern
              - Name: get_expensive_queries_from_cache
                Description: Get most expensive queries from plan cache
                InputSchema:
                  Type: object
                  Properties:
                    metric:
                      Type: string
                      Description: 'Sort metric: cpu, reads, duration (default cpu)'
                    top_n:
                      Type: integer
                      Description: Number of results (default 10)
              - Name: suggest_indexes
                Description: Get missing index suggestions from SQL Server
                InputSchema:
                  Type: object
                  Properties:
                    table_name:
                      Type: string
                      Description: 'Optional: filter to specific table'
              - Name: get_index_usage
                Description: Get index usage statistics
                InputSchema:
                  Type: object
                  Properties:
                    table_name:
                      Type: string
                      Description: 'Optional: filter to specific table'
              - Name: send_email_notification
                Description: Send an alert notification via SNS
                InputSchema:
                  Type: object
                  Properties:
                    subject:
                      Type: string
                      Description: Email subject
                    message:
                      Type: string
                      Description: Email body
                    severity:
                      Type: string
                      Description: INFO, WARNING, or CRITICAL
                  Required:
                  - subject
                  - message
  AgentSpace:
    Type: AWS::DevOpsAgent::AgentSpace
    Properties:
      Name:
        Ref: AgentSpaceName
      Description: Agent Space for SQL Server database operations
      OperatorApp:
        Iam:
          OperatorAppRoleArn:
            Fn::GetAtt:
            - WebappAdminRole
            - Arn
  AwsAccountAssociation:
    Type: AWS::DevOpsAgent::Association
    Properties:
      AgentSpaceId:
        Fn::GetAtt:
        - AgentSpace
        - AgentSpaceId
      ServiceId: aws
      Configuration:
        Aws:
          AccountId:
            Ref: AWS::AccountId
          AccountType: monitor
          AssumableRoleArn:
            Fn::GetAtt:
            - AgentSpaceRole
            - Arn
  McpService:
    Type: AWS::DevOpsAgent::Service
    DependsOn: InvokeGatewayPolicy
    Properties:
      ServiceType: mcpserversigv4
      ServiceDetails:
        MCPServerSigV4:
          Name: dbops-mcp
          Endpoint:
            Fn::GetAtt:
            - McpGateway
            - GatewayUrl
          Description: SQL Server diagnostic tools via AgentCore Gateway
          AuthorizationConfig:
            Region:
              Ref: AWS::Region
            Service: bedrock-agentcore
            McpRoleArn:
              Fn::GetAtt:
              - SigningRole
              - Arn
  McpToolAssociation:
    Type: AWS::DevOpsAgent::Association
    DependsOn:
    - QueryToolsTarget
    Properties:
      AgentSpaceId:
        Fn::GetAtt:
        - AgentSpace
        - AgentSpaceId
      ServiceId:
        Fn::GetAtt:
        - McpService
        - ServiceId
      Configuration:
        MCPServerSigV4:
          Tools:
          - dbops-query-tools___check_query_store_enabled
          - dbops-query-tools___get_blocking_sessions
          - dbops-query-tools___get_expensive_queries_from_cache
          - dbops-query-tools___get_index_usage
          - dbops-query-tools___get_query_execution_history
          - dbops-query-tools___get_query_plan_from_cache
          - dbops-query-tools___get_query_store_plan_summary
          - dbops-query-tools___get_query_store_regressed_queries
          - dbops-query-tools___get_query_store_top_queries
          - dbops-query-tools___get_query_store_wait_stats
          - dbops-query-tools___get_slow_queries
          - dbops-query-tools___send_email_notification
          - dbops-query-tools___suggest_indexes
  # BEGIN GENERATED ASSETS. Do not edit by hand. Source: skills/ and AGENTS.md.
  # Regenerate with build_skill_assets.py (run automatically by deploy.sh).
  SkillAsset:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !GetAtt AgentSpace.AgentSpaceId
      AssetType: skill
      Metadata:
        name: sql-server-investigation
        description: "Incident investigation procedures for Amazon RDS for SQL Server performance issues: blocking and lock contention, plan regression, slow or high-impact queries, and missing indexes."
        agent_types:
        - GENERIC
      Files:
      - Path: SKILL.md
        ContentText: |
          ---
          name: sql-server-investigation
          description: Incident investigation procedures for Amazon RDS for SQL Server
            performance issues including blocking and lock contention, plan regression,
            slow or high-impact queries, and missing indexes. Use this skill when
            investigating SQL Server database latency, high CPU, blocked sessions, query
            timeouts, or read/write performance degradation. Triggers on requests like
            "investigate SQL Server blocking", "RDS SQL Server high CPU", "query timeout
            RCA", "plan regression", or "why is my SQL Server slow".
          metadata:
            version: "1.0.0"
            aws-devops-agent-skills.agent-types: "Incident RCA"
            aws-devops-agent-skills.aws-services: "Amazon RDS"
            aws-devops-agent-skills.technical-domains: "Databases"
          ---

          # SQL Server Investigation

          Structured troubleshooting methodology for Amazon RDS for SQL Server. Work from
          the lightweight signal outward: use native AWS APIs to triage and localize the
          problem, then use the MCP tools to resolve the session-, plan-, and index-level
          detail those APIs cannot reach.

          ## Investigation Workflow

          Follow these steps in order for every investigation.

          ### Step 1: TRIAGE — Assess Overall Health

          Always start here regardless of the reported symptom. Retrieve current values and
          active alarms from native AWS APIs:

          ```
          cloudwatch.DescribeAlarms     # active alarms on the instance
          cloudwatch.GetMetricData      # CPUUtilization, DatabaseConnections,
                                        # FreeableMemory, FreeStorageSpace
          pi.GetResourceMetrics         # db.load — Average Active Sessions (AAS)
          ```

          **Severity thresholds:**

          | Severity | Criteria |
          |----------|----------|
          | CRITICAL | CPU > 90% OR AAS > 8 OR connections near max OR FreeableMemory < 1 GB |
          | WARNING | CPU > 70% OR AAS > 4 OR memory declining OR connections > 70% of max |
          | INFO | All metrics within normal ranges |

          ### Step 2: DIAGNOSE — Identify Bottleneck Type

          Use Performance Insights to find the dominant wait over the incident window, then
          route based on the wait type:

          ```
          pi.GetResourceMetrics         # db.load grouped by wait event
          pi.DescribeDimensionKeys      # top SQL by database time
          ```

          | Dominant Wait Type | Bottleneck | Go To |
          |-------------------|-----------|-------|
          | CPU | Compute-bound queries | Step 3a |
          | Lock / `LCK_M_*` | Blocking and locking | Step 3b |
          | IO / `PAGEIOLATCH` | Storage I/O saturation | Step 3c |
          | Memory / `RESOURCE_SEMAPHORE` | Memory pressure | Step 3d |
          | Network / `ASYNC_NETWORK_IO` | Network saturation | Step 3e |

          ### Step 3: DRILL DOWN — Investigate the Specific Area

          #### 3a: CPU-Bound

          ```
          get_query_store_top_queries        # metric="cpu" — top CPU consumers with plan_ids
          get_expensive_queries_from_cache   # metric="cpu" — heavy queries in plan cache
          suggest_indexes                    # missing indexes causing scans
          ```

          #### 3b: Blocking

          ```
          get_blocking_sessions              # blocking chains and head blocker
          get_slow_queries                   # long-running statements holding locks
          get_query_store_wait_stats         # lock wait time by query
          ```

          #### 3c: IO Saturation

          ```
          cloudwatch.GetMetricData           # ReadIOPS, WriteIOPS vs provisioned limits
          cloudwatch.GetMetricData           # ReadLatency, WriteLatency spikes
          get_query_store_top_queries        # metric="io" — heaviest I/O queries
          ```

          #### 3d: Memory Pressure

          ```
          cloudwatch.GetMetricData           # FreeableMemory trend over time
          get_query_store_top_queries        # metric="memory" — memory-grant-heavy queries
          pi.GetResourceMetrics              # db.load correlation with memory waits
          ```

          #### 3e: Network

          ```
          cloudwatch.GetMetricData           # NetworkReceiveThroughput, NetworkTransmitThroughput
          cloudwatch.GetMetricData           # DatabaseConnections — connection churn
          pi.DescribeDimensionKeys           # connected applications driving traffic
          ```

          ### Step 4: CORRELATE — Cross-Reference Findings

          ```
          get_query_store_regressed_queries  # recent regression or chronic? (MCP)
          pi.GetResourceMetrics              # current load vs historical baseline
          pi.DescribeDimensionKeys           # which users and applications contribute most load
          ```

          ### Step 5: RECOMMEND — Produce Actionable Output

          Structure the response as:

          1. **Severity** — CRITICAL / WARNING / INFO with the supporting thresholds.
          2. **Root cause** — one-sentence diagnosis with metric values.
          3. **Evidence** — specific numbers, timestamps, percentages, session IDs, SQL
             text, `plan_id`s, and regression factor where applicable.
          4. **Recommendations** — ordered, most impactful first.
          5. **Queries to investigate** — specific SQL statements to review.
          6. **Index suggestions** — `CREATE INDEX` statements if applicable.

          ## Data Source Boundaries

          Prefer native AWS APIs for everything they expose; reserve the MCP tools for
          SQL-level detail those APIs cannot reach.

          Available natively through AWS APIs (prefer these):

          - CloudWatch metrics — CPU, memory, storage, IOPS, latency, connections.
          - Performance Insights / Database Insights — database load, top wait events, top
            SQL by database time, active sessions.
          - CloudWatch Logs — SQL Server error log, including deadlock traces (trace flags
            1204/1222).
          - CloudTrail — parameter group changes, failovers, configuration modifications.

          Only available through the MCP tools (direct SQL connection required) — for
          example:

          - The exact blocking chain and head blocker (`get_blocking_sessions`).
          - Execution-plan regression history (`get_query_store_regressed_queries`).
          - Top resource-consuming queries with plan_ids (`get_query_store_top_queries`).
          - Queries and plans from the cache (`get_expensive_queries_from_cache`,
            `get_query_plan_from_cache`).
          - Live missing-index recommendations and existing index usage
            (`suggest_indexes`, `get_index_usage`).
      - Path: references/tool-reference.md
        ContentText: |
          # Tool Reference

          ## Health Metrics Thresholds

          Host metrics are read by the DevOps Agent natively (CloudWatch and Performance
          Insights / Database Insights); they are not MCP tools. Use these thresholds during
          triage.

          | Metric | Normal | Warning | Critical | Source |
          |--------|--------|---------|----------|--------|
          | CPU Utilization | < 70% | 70 to 90% | > 90% | CloudWatch |
          | Database Load (AAS) | < 2 | 2 to 4 | > 4 | Performance Insights |
          | Connections | < 80% of max | 80 to 90% of max | > 90% of max | CloudWatch |
          | Freeable Memory | > 2 GB | 1 to 2 GB | < 1 GB | CloudWatch |
          | Free Storage | > 20% | 10 to 20% | < 10% | CloudWatch |
          | Read/Write Latency | < 5 ms | 5 to 20 ms | > 20 ms | CloudWatch |

          ## Tool Parameters

          These are the MCP query tools the agent calls for SQL-level detail.

          | Tool | Key Parameter | Default | Usage |
          |------|--------------|---------|-------|
          | `get_query_store_top_queries` | `metric` | `"cpu"` | Sort by: `"cpu"`, `"duration"`, `"io"`, `"memory"` |
          | `get_query_store_top_queries` | `top_n` | 10 | Number of results to return |
          | `get_slow_queries` | `threshold_seconds` | 5 | Minimum elapsed time to qualify |
          | `get_expensive_queries_from_cache` | `metric` | `"cpu"` | Sort by: `"cpu"`, `"reads"`, `"duration"` |
          | `suggest_indexes` | `table_name` | None | Optional filter to specific table |
          | `send_email_notification` | `severity` | `"INFO"` | `"INFO"`, `"WARNING"`, `"CRITICAL"` |

          ## Wait Event Categories

          | Wait Category | Common Waits | Indicates |
          |--------------|-------------|-----------|
          | CPU | SOS_SCHEDULER_YIELD, CXPACKET | Compute-bound workload |
          | Lock | LCK_M_X, LCK_M_S, LCK_M_U | Blocking between sessions |
          | IO | PAGEIOLATCH_SH, PAGEIOLATCH_EX, WRITELOG | Storage bottleneck |
          | Memory | RESOURCE_SEMAPHORE, CMEMTHREAD | Memory pressure |
          | Network | ASYNC_NETWORK_IO | Client not consuming results fast enough |
  AgentsMdAsset:
    Type: AWS::DevOpsAgent::Asset
    Properties:
      AgentSpaceId: !GetAtt AgentSpace.AgentSpaceId
      AssetType: agents_md
      Metadata:
        agent_type: INCIDENT_RCA
      Files:
      - Path: AGENTS.md
        ContentText: |
          Agent Type: Investigation (INCIDENT_RCA)

          # Investigation Agent Instructions

          ## SQL Server Investigations

          When investigating issues involving SQL Server or RDS SQL Server instances, always
          use the `sql-server-investigation` skill.

          ### Triggers

          Apply this skill when the investigation involves any of the following:

          - SQL Server or MSSQL database instances
          - RDS SQL Server (any edition)
          - High CPU, query timeouts, or performance issues on SQL Server
          - Blocking, deadlocks, or lock contention
          - Query performance degradation or regressions

          ### Why

          The `sql-server-investigation` skill provides SQL Server-specific diagnostic
          capabilities including:

          - DMV analysis (`sys.dm_exec_requests`, `sys.dm_tran_locks`, `sys.dm_os_waiting_tasks`)
          - Blocking chain identification
          - Wait event interpretation (LCK_M_IX, LCK_M_X, LCK_M_S, CXPACKET, etc.)
          - Query Store and execution plan analysis
          - Extended Events (XEL) file parsing

          These capabilities go beyond generic AWS observability tools and provide deeper root
          cause analysis for SQL Server-specific issues.
  # END GENERATED ASSETS
Outputs:
  GatewayUrl:
